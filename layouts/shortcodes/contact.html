{{- $email := .Get "email" -}}
<p class="contact">
  {{- with $email }}
  <a class="contact-email" href="mailto:{{ . }}" data-email="{{ . }}" title="{{ . }}" aria-label="Email">
    <svg class="icon-mail" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 7.5l8.5 6 8.5-6"/></svg>
    <svg class="icon-check" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
  </a>
  {{- end }}
  {{- with .Get "github" }}
  <a href="{{ . }}" title="GitHub" aria-label="GitHub">
    <svg width="22" height="22" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
  </a>
  {{- end }}
  {{- with .Get "linkedin" }}
  <a href="{{ . }}" title="LinkedIn" aria-label="LinkedIn">
    <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="3.5" fill="currentColor"/><g fill="none" stroke="var(--bg-color)" stroke-width="2.4"><path d="M7.6 10.4V17"/><path d="M11.8 17v-6.6M11.8 13.2c0-1.7 1.1-2.9 2.7-2.9 1.7 0 2.7 1 2.7 2.9V17"/></g><circle cx="7.6" cy="7.4" r="1.5" fill="var(--bg-color)"/></svg>
  </a>
  {{- end }}
</p>
<script>
(function () {
  var link = document.querySelector('.contact-email');
  if (!link) return;
  // Phones almost always have a mail app, so let mailto: work there.
  // On desktop (mouse), copy the address instead, which works for everyone.
  if (!window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;
  var timer;
  function done() {
    link.classList.add('copied');
    link.setAttribute('aria-label', 'Email address copied');
    link.title = 'Copied!';
    clearTimeout(timer);
    timer = setTimeout(function () {
      link.classList.remove('copied');
      link.setAttribute('aria-label', 'Email');
      link.title = link.dataset.email;
    }, 1500);
  }
  link.addEventListener('click', function (e) {
    var addr = link.dataset.email;
    if (navigator.clipboard && window.isSecureContext) {
      e.preventDefault();
      navigator.clipboard.writeText(addr).then(done, function () { window.location.href = 'mailto:' + addr; });
    } else {
      var t = document.createElement('textarea');
      t.value = addr; t.style.position = 'fixed'; t.style.opacity = '0';
      document.body.appendChild(t); t.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (err) {}
      document.body.removeChild(t);
      if (ok) { e.preventDefault(); done(); }
    }
  });
})();
</script>
