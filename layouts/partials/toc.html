{{ if .TableOfContents }}
<button class="toc-open" type="button" aria-controls="toc">Contents</button>
<aside class="toc-container" id="toc" aria-label="Contents">
  <button class="toc-close" type="button" aria-label="Hide contents">
    <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
      <path d="M3 3l16 16M19 3L3 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
    </svg>
  </button>
  <h2>Contents</h2>
  {{ .TableOfContents }}
</aside>
<script>
(function () {
  function init() {
    var toc = document.getElementById('toc');
    if (!toc) return;
    var root = document.documentElement;
    toc.querySelector('.toc-close').addEventListener('click', function () { root.classList.add('toc-hidden'); root.classList.remove('toc-shown'); });
    document.querySelector('.toc-open').addEventListener('click', function () { root.classList.remove('toc-hidden'); root.classList.add('toc-shown'); });

    var links = Array.prototype.slice.call(toc.querySelectorAll('#TableOfContents a'));
    var targets = [];
    links.forEach(function (a) {
      var el = document.getElementById(decodeURIComponent(a.getAttribute('href').slice(1)));
      if (el) targets.push({ el: el, link: a });
    });
    function update() {
      var line = window.innerHeight * 0.3;
      var current = null;
      targets.forEach(function (t) {
        if (t.el.getBoundingClientRect().top <= line) current = t;
      });
      if (window.scrollY > 0 && window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2 && targets.length) {
        current = targets[targets.length - 1];
      }
      links.forEach(function (l) { l.classList.remove('active'); });
      if (current) current.link.classList.add('active');
    }
    window.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update);
    update();
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
{{ end }}
